# Deployment on a LAN box fronted by `tailscale serve` (see README, "Deploying"). The port is published on the
# host's loopback only; Tailscale (HTTPS, tailnet-only) is the sole way in.
services:
  nudge:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: nudge:latest
    container_name: nudge
    restart: unless-stopped
    user: '1000:1000' # matches the owner of ./data on the host
    ports:
      - '127.0.0.1:4517:4517'
    environment:
      # Set these in a gitignored .env next to this file, e.g.
      #   NUDGE_ALLOWED_HOSTS=phoenix.your-tailnet.ts.net
      #   NUDGE_ALLOWED_USERS=you@example.com
      NUDGE_ALLOWED_HOSTS: ${NUDGE_ALLOWED_HOSTS:-}
      NUDGE_ALLOWED_USERS: ${NUDGE_ALLOWED_USERS:-}
      # Cloudflare Access (optional): hosts behind it are authenticated by its signed token, not by a header, e.g.
      #   NUDGE_ACCESS_HOSTS=nudge.example.com
      #   NUDGE_ACCESS_TEAM_DOMAIN=your-team.cloudflareaccess.com
      #   NUDGE_ACCESS_AUD=<the Access application's audience tag>
      # and NUDGE_ALLOWED_USERS must then hold the exact email(s) allowed. Compose passes only the variables listed.
      NUDGE_ACCESS_HOSTS: ${NUDGE_ACCESS_HOSTS:-}
      NUDGE_ACCESS_TEAM_DOMAIN: ${NUDGE_ACCESS_TEAM_DOMAIN:-}
      NUDGE_ACCESS_AUD: ${NUDGE_ACCESS_AUD:-}
      # Or paste the key into Settings (then it lives in the database and its backups instead).
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - ./data:/app/data
