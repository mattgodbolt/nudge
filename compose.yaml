# Deployment on a box fronted by a Cloudflare Tunnel with Cloudflare Access in front of it (see README, "Deploying").
# The port is published on the host's loopback only; Access (HTTPS, signed-in users only) is the sole way in.
services:
  nudge:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: nudge:latest
    container_name: nudge
    restart: unless-stopped
    user: '1000:1000' # matches the owner of ./data on the host
    # It needs no Linux capabilities and never escalates; everything it writes goes to ./data (or /tmp, for SQLite's
    # temporary files), so the rest of the filesystem is read-only.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    ports:
      - '127.0.0.1:4517:4517'
    environment:
      # Set these in a gitignored .env next to this file (see .env.example). Hosts behind Cloudflare Access are
      # authenticated by its signed token, and the email in it must be one of NUDGE_ALLOWED_USERS, e.g.
      #   NUDGE_ACCESS_HOSTS=nudge.example.com
      #   NUDGE_ACCESS_TEAM_DOMAIN=your-team.cloudflareaccess.com
      #   NUDGE_ACCESS_AUD=<the Access application's audience tag>
      #   NUDGE_ALLOWED_USERS=you@example.com
      # Compose passes only the variables listed here.
      NUDGE_ALLOWED_USERS: ${NUDGE_ALLOWED_USERS:-}
      NUDGE_ACCESS_HOSTS: ${NUDGE_ACCESS_HOSTS:-}
      NUDGE_ACCESS_TEAM_DOMAIN: ${NUDGE_ACCESS_TEAM_DOMAIN:-}
      NUDGE_ACCESS_AUD: ${NUDGE_ACCESS_AUD:-}
      # Or paste the key into Settings (then it lives in the database and its backups instead).
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # Optional: the OAuth client for posting replies (else Settings), and the contact sent to push services.
      NUDGE_GOOGLE_CLIENT_ID: ${NUDGE_GOOGLE_CLIENT_ID:-}
      NUDGE_GOOGLE_CLIENT_SECRET: ${NUDGE_GOOGLE_CLIENT_SECRET:-}
      NUDGE_PUSH_SUBJECT: ${NUDGE_PUSH_SUBJECT:-}
    volumes:
      - ./data:/app/data
