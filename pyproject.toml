[tool.poetry]
name = "youtubey"
version = "0.1.0"
description = "Crawl YouTube"
authors = ["Matt Godbolt <matt@godbolt.org>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
google-api-python-client = "^2.154.0"
click = "^8.1.7"

[tool.poetry.scripts]
youtubey = 'youtubey.main:cli'

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
